name: Build and Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW
        shell: pwsh
        run: |
          $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/13.2.0-rt_v11-rev0/x86_64-13.2.0-release-win32-seh-msvcrt-rt_v11-rev0.7z"
          Invoke-WebRequest -Uri $url -OutFile mingw.7z
          7z x mingw.7z -oC:\mingw
          Remove-Item mingw.7z
          "C:\mingw\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        run: cmake -G "MinGW Makefiles" -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Package
        working-directory: build
        run: cpack

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: build/package/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # SFML is built from source, so its build dependencies are needed
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libxrandr-dev libxcursor-dev libxi-dev libudev-dev \
            libfreetype-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure CMake
        run: cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Package
        working-directory: build
        run: cpack

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: build/package/*
          if-no-files-found: error

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get project version
        id: get_version
        shell: bash
        run: |
          major=$(grep -oP 'set\(PROJECT_VERSION_MAJOR \K[^ )]*' CMakeLists.txt)
          minor=$(grep -oP 'set\(PROJECT_VERSION_MINOR \K[^ )]*' CMakeLists.txt)
          patch=$(grep -oP 'set\(PROJECT_VERSION_PATCH \K[^ )]*' CMakeLists.txt)
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v-${{ steps.get_version.outputs.version }}"
          gh release create "$tag" \
            --title "Release $tag" \
            --generate-notes \
            artifacts/*
